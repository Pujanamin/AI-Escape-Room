<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escape Room — Version 1</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="room">
    <header>
      <p class="eyebrow">THE CLOCKWORK STUDY · VERSION 1</p>
      <h1>Find the key.</h1>
      <p class="subheading">Prototype: solve the single riddle to escape.</p>
    </header>
    <section class="puzzle-card">
      <h2>Your clue</h2>
      <p>I have keys but open no locks. What am I?</p>
    </section>
    <form id="v1-form">
      <label for="v1-answer">Your answer</label>
      <div class="controls">
        <input id="v1-answer" maxlength="500" required>
        <button type="submit">Try answer</button>
      </div>
    </form>
    <p id="v1-reply" role="status" class="notice"></p>
    <p><a href="/">Try Version 2</a></p>
  </main>
  <script>
    document.getElementById("v1-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const answer = document.getElementById("v1-answer").value;
      const response = await fetch("/answer", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({answer})
      });
      const result = await response.json();
      document.getElementById("v1-reply").textContent = result.reply;
    });
  </script>
</body>
</html>
